# dsh-mcp-tavily - composition patch.
#
# One row, because both halves now live behind the same key resolution:
#
# `web-search-tavily` (this package's index.js) does two things:
#
#   1. Registers a Tavily search provider on the ctx.web seam. The `web`
#      override below pins the seam to that provider - without it the built-in
#      DeepSeek search is used.
#
#      An id-targeted override replaces the entry's whole `config`, so dsh-base's
#      `fetchProvider` must be restated; otherwise a second fetch provider makes
#      web fetch fail as WEB_PROVIDER_AMBIGUOUS.
#
#   2. Mounts Tavily's hosted remote MCP server through the CLI-shipped MCP
#      client, adding mcp__tavily__tavily-search / -extract / -map / -crawl /
#      -research.
#
# The MCP client is deliberately NOT inserted from this file. An insert is
# applied at load time, so it could only read `process.env` - which made the
# environment variable the only way to key these tools and left the settings card
# unable to own the key (credentials-local refuses to store a name the launching
# environment already supplies). Mounting it from index.js instead lets both
# halves resolve the key the same way: credentials plane, then the `apiKeyEnv`
# reference, then Tavily's free keyless mode.
#
# The key is never written into this file, and never into the URL, where it would
# leak into logs and proxies.
- id: web
  config:
    searchProvider: tavily
    fetchProvider: http

- insert:
    - id: web-search-tavily
      name: dsh-mcp-tavily
